name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm --filter canvas-scan run test
      - run: pnpm --filter demo run build
      # The agent handoff is plain data with its own reader. No browser is
      # involved, so it runs with the unit suite rather than behind Chrome.
      - run: pnpm --filter dogfood run handoff:test
      # The north-star benchmark protocol: the manifest, the sealed answer key,
      # and the scorer. No browser and no participant, and it is what must hold
      # before six people are asked for two hours each.
      - run: pnpm --filter dogfood run benchmark:test

  # The unit suite cannot see the overlay running. These checks drive the real
  # thing in headless Chrome, which is where the frame loop, the commit loop,
  # canvas retirement, and the sampled path actually exist.
  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The injection check installs the IIFE bundle at document-start, so the
      # package has to be built, not only the demo.
      - run: pnpm --filter canvas-scan run build
      - run: pnpm --filter demo run build
      - run: node scripts/browser-tests.mjs
      # The guided-investigation command is the one path a user drives by hand,
      # so nothing else can prove it works. The fixture drives the whole ritual
      # through the overlay's own controls against the demo app.
      - run: pnpm --filter dogfood run investigate:test
      # "canvas-scan sends nothing anywhere" is a claim, so it is checked:
      # the complete workflow runs with external access cut off, every
      # request it makes is classified, and the command's own process is
      # watched for a socket leaving the machine.
      - run: pnpm --filter dogfood run network-silence:test
      # The corpus manifest, its checker, and the runner's pipeline against a
      # repository made for the test. The three real applications are not run
      # here: the corpus is advisory and must never fail a release because
      # somebody else's build broke.
      - run: pnpm --filter dogfood run corpus:test
      # The advisory baseline comparison. It compares structure only — no
      # millisecond enters a baseline — and it can never report faster,
      # slower, fixed or improved from one pair of recordings.
      - run: pnpm --filter dogfood run corpus:baseline:test
      # The six benchmark fixtures, driven in real Chrome. A seeded defect that
      # stops happening would waste six people's afternoon, and nothing else
      # would catch it: the scorer only checks that the answer key is
      # well-formed, not that the page still behaves the way it describes.
      - run: pnpm --filter dogfood run benchmark:fixtures:test

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-pack.mjs
