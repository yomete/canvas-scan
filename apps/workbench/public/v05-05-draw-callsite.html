  html { color-scheme: dark; background: #020617; color: #e2e8f0; font: 14px ui-monospace, monospace; }

  canvas { border: 1px solid #334155; }

<canvas id="selected" width="40" height="40"></canvas>
<script src="/canvas-scan.iife.js"></script>
<script>
  window.__V05_05__ = {
    frame: () => new Promise(resolve => requestAnimationFrame(() => resolve())),
    async makeSource() {
      const context = document.querySelector('#selected').getContext('2d');
      window.__CANVAS_SCAN__.startRecording();
      for (let index = 0; index < 4; index++) {
        context.fillRect(0, 0, 2, 2);
        context.fillRect(1, 1, 2, 2);
        await this.frame();
      }
      return window.__CANVAS_SCAN__.stopRecording();
    },
    async replay(draw) {
      const canvas = document.querySelector('#selected');
      await this.frame();
      const context = canvas.getContext('2d');
      draw(context, 10); await this.frame();
      draw(context, 10); await this.frame();
      draw(context, 11); await this.frame();
    },
  };
</script>
