<!doctype html>
<meta charset="utf-8">
<title>Task: scene-overdraw</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; padding: 16px; }
  canvas { border: 1px solid #ccc; display: block; }
  p { max-width: 60ch; color: #444; }
</style>
<h1>Scene</h1>
<p>Move the pointer slowly back and forth across the scene for ten seconds.</p>
<canvas id="scene" width="900" height="500"></canvas>
<script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const shapes = [];
  for (let index = 0; index < 400; index++) {
    shapes.push({
      x: (index % 25) * 36 + 6, y: Math.floor(index / 25) * 30 + 6,
      hue: (index * 11) % 360,
    });
  }
  function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const shape of shapes) {
      ctx.fillStyle = `hsl(${shape.hue} 65% 55%)`;
      ctx.fillRect(shape.x, shape.y, 28, 22);
      ctx.strokeStyle = '#333';
      ctx.strokeRect(shape.x, shape.y, 28, 22);
    }
  }
  drawScene();
  // The pointer position is never used by drawScene, so every one of these
  // frames paints exactly what is already on the canvas.
  canvas.addEventListener('pointermove', () => { drawScene(); });
</script>
